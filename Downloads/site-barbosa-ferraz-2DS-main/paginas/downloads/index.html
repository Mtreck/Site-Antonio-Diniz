<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../../imagens-principais/logo-colegio.png">
  <title>Downloads | Colégio Estadual Barbosa Ferraz</title>
  <!-- Estilo compartilhado por todas as páginas -->
  <link rel="stylesheet" href="../../main.css">
  <!-- Estilo só desta página (equipe Downloads) -->
  <link rel="stylesheet" href="pagina.css">
</head>
<body data-pagina="downloads">

  <!-- O menu é montado pelo arquivo principal main.js -->
  <div id="menu"></div>

  <main class="container">
    <!-- Seção de documentos e arquivos para download -->
    <section class="downloads" aria-labelledby="downloads-titulo">

      <!-- Cabeçalho: título, apresentação e orientação ao visitante -->
      <header class="downloads-header">
        <h1 id="downloads-titulo">Downloads</h1>
        <p>
          Aqui você encontra os documentos e arquivos do colégio, como planos de
          ensino e outros materiais, reunidos em um só lugar.
        </p>
        <p>Selecione uma das opções abaixo para acessar o arquivo desejado.</p>
      </header>

      <!-- Grade de cards: preenchida pelo pagina.js -->
      <div class="downloads-grid" id="downloads-grid"></div>

    </section>
  </main>

  <!-- O rodapé é montado pelo arquivo principal main.js -->
  <div id="rodape"></div>

  <!-- Primeiro os comportamentos globais, depois o JavaScript desta página -->
  <script src="../../main.js"></script>
  <script src="pagina.js"></script>
</body>
</html>
